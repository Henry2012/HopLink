plugins { id 'com.android.application' }
def localSigning = new Properties()
rootProject.file('.tools/signing.properties').withInputStream { localSigning.load(it) }
android {
    namespace 'cn.hqq.simplenode'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.hqq.simplenode'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        local {
            storeFile rootProject.file('.tools/signing.jks')
            storePassword localSigning.getProperty('password')
            keyAlias 'simplenode'
            keyPassword localSigning.getProperty('password')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.local }
        release { signingConfig signingConfigs.local; minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
